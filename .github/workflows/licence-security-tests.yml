name: Licence Security Regression Tests

on:
  push:
    branches: [main]
    paths:
      - "license_routes_v24.py"
      - "license_owner_ops.py"
      - "tests/test_license*.py"
      - ".github/workflows/licence-security-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "license_routes_v24.py"
      - "license_owner_ops.py"
      - "tests/test_license*.py"
      - ".github/workflows/licence-security-tests.yml"

permissions:
  contents: read

jobs:
  licence-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip Flask pytest
      - name: Run licence security regressions
        run: python -m pytest -q tests/test_license*.py
