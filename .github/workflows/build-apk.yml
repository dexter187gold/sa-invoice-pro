name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/build-apk.yml'
      - 'capacitor.config.json'
      - 'version.json'

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use runner Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          for d in "$SDK"/cmdline-tools/*/bin; do [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"; done
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "SDK=$SDK"

      - name: Install platform 34 + build-tools
        run: |
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" || true
          else
            echo "::warning::sdkmanager not found — using preinstalled SDK"
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: npm + web build + Capacitor
        run: |
          set -e
          npm install --no-audit --no-fund
          npm run build
          test -d dist
          npm install --no-audit --no-fund \
            @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 \
            @capacitor/share@6 @capacitor/filesystem@6
          if [ ! -f capacitor.config.json ]; then
            npx cap init "SA Invoice Pro Lab" pro.sainvoice.lab --web-dir dist
          fi
          node << 'NODE'
          const fs = require('fs');
          let c = {};
          try { c = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8')); } catch {}
          c.appId = 'pro.sainvoice.lab';
          c.appName = 'SA Invoice Pro Lab';
          c.webDir = 'dist';
          c.android = c.android || {};
          c.android.allowMixedContent = true;
          fs.writeFileSync('capacitor.config.json', JSON.stringify(c, null, 2));
          NODE
          [ -d android ] || npx cap add android
          npx cap sync android
          test -f android/app/build.gradle

      - name: Ensure SDK versions + permissions + MainActivity
        run: |
          set -e
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle || true
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle || true
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true
            grep -q 'compileSdkVersion' android/variables.gradle || echo 'ext { compileSdkVersion = 34; targetSdkVersion = 34; minSdkVersion = 24 }' >> android/variables.gradle
            cat android/variables.gradle
          fi
          python3 << 'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          t = p.read_text()
          if not re.search(r'compileSdk(Version)?\s+', t):
              t = t.replace(
                  "android {",
                  "android {\n    compileSdkVersion 34\n    defaultConfig {\n        minSdkVersion 24\n        targetSdkVersion 34\n    }\n",
                  1,
              )
              print("Injected compileSdkVersion 34")
          else:
              t = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 34', t)
              t = re.sub(r'compileSdk\s+\d+', 'compileSdk 34', t)
              t = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 34', t)
              t = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', t)
              print("Normalized SDK versions")
          if "applicationId" not in t:
              t = t.replace(
                  "defaultConfig {",
                  'defaultConfig {\n        applicationId "pro.sainvoice.lab"\n',
                  1,
              )
          p.write_text(t)
          print("app/build.gradle OK")
          PY
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          for perm, maxsdk in [
            ("android.permission.ACCESS_NETWORK_STATE", None),
            ("android.permission.READ_EXTERNAL_STORAGE", "32"),
            ("android.permission.WRITE_EXTERNAL_STORAGE", "28"),
            ("android.permission.READ_MEDIA_IMAGES", None),
            ("android.permission.POST_NOTIFICATIONS", None),
          ]:
            if perm in t:
              continue
            idx = t.find('android:name="android.permission.INTERNET"')
            if idx < 0:
              continue
            end = t.find("/>", idx) + 2
            extra = (
              f'\n    <uses-permission android:name="{perm}" android:maxSdkVersion="{maxsdk}" />'
              if maxsdk
              else f'\n    <uses-permission android:name="{perm}" />'
            )
            t = t[:end] + extra + t[end:]
          if "requestLegacyExternalStorage" not in t:
            t = t.replace("<application ", '<application android:requestLegacyExternalStorage="true" ', 1)
          p.write_text(t)
          print("manifest OK")
          PY
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <external-path name="external" path="." />
            <external-files-path name="external_files" path="." />
            <files-path name="files" path="." />
            <cache-path name="cache" path="." />
          </paths>
          XML
          MA=$(find android/app/src/main/java -name MainActivity.java 2>/dev/null | head -1)
          if [ -z "$MA" ]; then
            MA=android/app/src/main/java/pro/sainvoice/lab/MainActivity.java
            mkdir -p "$(dirname "$MA")"
          fi
          PKG=$(echo "$MA" | sed -n 's|.*java/\(.*\)/MainActivity.java|\1|p' | tr '/' '.')
          [ -n "$PKG" ] || PKG=pro.sainvoice.lab
          cat > "$MA" << JAVA
          package ${PKG};
          import com.getcapacitor.BridgeActivity;
          import android.os.Bundle;
          import android.os.Build;
          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (Build.VERSION.SDK_INT >= 23) {
                try {
                  requestPermissions(new String[] {
                    android.Manifest.permission.READ_EXTERNAL_STORAGE,
                    android.Manifest.permission.WRITE_EXTERNAL_STORAGE,
                    "android.permission.READ_MEDIA_IMAGES",
                    "android.permission.POST_NOTIFICATIONS"
                  }, 1001);
                } catch (Exception ignored) {}
              }
            }
          }
          JAVA
          echo "MainActivity package=$PKG path=$MA"

      - name: Keystore (optional, never fails job)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +e
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t')
          if [ -n "$CLEAN" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            if printf '%s' "$CLEAN" | base64 -d > android/app/saip-lab.keystore 2>/dev/null; then
              if keytool -list -keystore android/app/saip-lab.keystore -storepass "$STORE_PASS" >/dev/null 2>&1; then
                cat > android/keystore.properties << EOF
          storeFile=app/saip-lab.keystore
          storePassword=${STORE_PASS}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASS:-$STORE_PASS}
          EOF
                echo "Keystore OK"
              else
                echo "::warning::Keystore password mismatch — debug signing"
                rm -f android/app/saip-lab.keystore android/keystore.properties
              fi
            else
              echo "::warning::Invalid ANDROID_KEYSTORE_BASE64 — debug signing"
              rm -f android/app/saip-lab.keystore
            fi
          else
            echo "::warning::No keystore secrets — debug signing"
          fi
          exit 0

      - name: Safe signingConfig patch (append only)
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          if "signingConfig signingConfigs.debug" not in t and "signingConfig signingConfigs.release" not in t:
              if "buildTypes" in t and "release {" in t:
                  t = t.replace(
                      "release {",
                      "release {\n            signingConfig signingConfigs.debug\n",
                      1,
                  )
                  print("Added release → signingConfigs.debug fallback")
              else:
                  print("No release block found — skip signing patch")
          else:
              print("signingConfig already present")
          p.write_text(t)
          for i, line in enumerate(t.splitlines()[:40], 1):
              print(f"{i:3}| {line}")
          PY
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Assemble (release, fallback debug)
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/gradle-release.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" -eq 0 ]; then
            echo "RELEASE_OK"
            exit 0
          fi
          echo "::warning::assembleRelease failed (rc=$RC) — trying assembleDebug"
          grep -E "What went wrong|compileSdk|error:|FAILED|Exception" /tmp/gradle-release.log | tail -30 || true
          ./gradlew assembleDebug --no-daemon --stacktrace
          exit $?

      - name: Package artifact
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          test -n "$APK"
          ls -lh "$APK"
          VER=$(node -p "require('./package.json').version")
          cp "$APK" "SA-Invoice-Pro-Lab-v${VER}.apk"
          echo "Artifact: SA-Invoice-Pro-Lab-v${VER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SA-Invoice-Pro-Lab-APK
          path: SA-Invoice-Pro-Lab-v*.apk
          retention-days: 30
