name: Build signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'index.html'
      - '.github/workflows/build-apk.yml'

jobs:
  android:
    name: Android release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use runner Android SDK
        run: |
          set -e
          # GitHub ubuntu-latest already ships an Android SDK
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          if [ ! -d "$SDK" ]; then SDK=/usr/lib/android-sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          # cmdline-tools path variants on runner images
          for d in "$SDK"/cmdline-tools/*/bin; do
            [ -d "$d" ] && echo "$d" >> "$GITHUB_PATH"
          done
          echo "Using ANDROID_HOME=$SDK"
          ls "$SDK" || true

      - name: Install platform 34 + build-tools
        run: |
          set -e
          SDK="${ANDROID_HOME}"
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            echo "sdkmanager not found; trying apt packages path"
            SM=$(which sdkmanager || true)
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/tmp/sdk-lic.log 2>&1 || true
          "$SM" "platform-tools" "platforms;android-34" "build-tools;34.0.0" || \
            "$SM" "platforms;android-34" "build-tools;34.0.0" || true
          ls "$SDK/platforms" || true
          ls "$SDK/build-tools" || true

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Build web (Vite)
        run: npm run build

      - name: Install Capacitor + plugins
        run: |
          npm install --no-audit --no-fund \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6 \
            @capacitor/share@6 \
            @capacitor/filesystem@6

      - name: Init / sync Capacitor Android
        run: |
          set -e
          if [ ! -f capacitor.config.json ] && [ ! -f capacitor.config.ts ]; then
            npx cap init "SA Invoice Pro Lab" pro.sainvoice.lab --web-dir dist
          fi
          node << 'NODE'
          const fs = require('fs');
          const p = 'capacitor.config.json';
          let c = {};
          try { c = JSON.parse(fs.readFileSync(p, 'utf8')); } catch {}
          c.appId = 'pro.sainvoice.lab';
          c.appName = 'SA Invoice Pro Lab';
          c.webDir = 'dist';
          fs.writeFileSync(p, JSON.stringify(c, null, 2));
          NODE
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Patch permissions + SDK 34 + MainActivity
        run: |
          set -e
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          t = p.read_text()
          perms = [
            ("android.permission.ACCESS_NETWORK_STATE", None),
            ("android.permission.READ_EXTERNAL_STORAGE", "32"),
            ("android.permission.WRITE_EXTERNAL_STORAGE", "28"),
            ("android.permission.READ_MEDIA_IMAGES", None),
            ("android.permission.READ_MEDIA_VIDEO", None),
            ("android.permission.POST_NOTIFICATIONS", None),
          ]
          if "android.permission.INTERNET" not in t:
              t = t.replace(">", '>\n    <uses-permission android:name="android.permission.INTERNET" />\n', 1)
          for perm, maxsdk in perms:
              if perm in t:
                  continue
              needle = 'android:name="android.permission.INTERNET"'
              idx = t.find(needle)
              if idx < 0:
                  continue
              end = t.find("/>", idx) + 2
              extra = f'\n    <uses-permission android:name="{perm}" android:maxSdkVersion="{maxsdk}" />' if maxsdk else f'\n    <uses-permission android:name="{perm}" />'
              t = t[:end] + extra + t[end:]
          if "requestLegacyExternalStorage" not in t:
              t = t.replace("<application ", '<application android:requestLegacyExternalStorage="true" ', 1)
          p.write_text(t)
          print("manifest patched")
          PY
          if [ -f android/variables.gradle ]; then
            sed -i 's/compileSdkVersion = .*/compileSdkVersion = 34/' android/variables.gradle || true
            sed -i 's/targetSdkVersion = .*/targetSdkVersion = 34/' android/variables.gradle || true
            sed -i 's/minSdkVersion = .*/minSdkVersion = 24/' android/variables.gradle || true
          fi
          mkdir -p android/app/src/main/res/xml
          printf '%s\n' '<?xml version="1.0" encoding="utf-8"?>' '<paths>' '  <external-path name="external" path="." />' '  <external-files-path name="external_files" path="." />' '  <files-path name="files" path="." />' '  <cache-path name="cache" path="." />' '</paths>' > android/app/src/main/res/xml/file_paths.xml
          MA=$(find android/app/src/main/java -name 'MainActivity.java' 2>/dev/null | head -1)
          if [ -n "$MA" ] && ! grep -q requestPermissions "$MA"; then
            python3 -c "
          from pathlib import Path
          p=Path('$MA'); t=p.read_text()
          body='''extends BridgeActivity {
            @Override
            public void onCreate(android.os.Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              if (android.os.Build.VERSION.SDK_INT >= 23) {
                try {
                  requestPermissions(new String[] {
                    android.Manifest.permission.READ_EXTERNAL_STORAGE,
                    android.Manifest.permission.WRITE_EXTERNAL_STORAGE,
                    \"android.permission.READ_MEDIA_IMAGES\",
                    \"android.permission.POST_NOTIFICATIONS\"
                  }, 1001);
                } catch (Exception ignored) {}
              }
            }
          '''
          t=t.replace('extends BridgeActivity {}', body).replace('extends BridgeActivity {', body, 1) if 'requestPermissions' not in t else t
          p.write_text(t); print('MainActivity ok')
          "
          fi

      - name: Setup keystore (optional secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASS" ] && [ -n "$KEY_ALIAS" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/saip-lab.keystore
            cat > android/keystore.properties << EOF
          storeFile=saip-lab.keystore
          storePassword=${STORE_PASS}
          keyAlias=${KEY_ALIAS}
          keyPassword=${KEY_PASS:-$STORE_PASS}
          EOF
            echo "Keystore configured"
          else
            echo "::warning::No keystore secrets — debug/default signing"
          fi

      - name: Configure Gradle signing
        run: |
          python3 << 'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          if "signingConfigs" not in t:
              block = '''
              signingConfigs {
                  release {
                      def kp = rootProject.file("keystore.properties")
                      if (kp.exists()) {
                          def props = new Properties()
                          props.load(new FileInputStream(kp))
                          storeFile rootProject.file(props["storeFile"])
                          storePassword props["storePassword"]
                          keyAlias props["keyAlias"]
                          keyPassword props["keyPassword"]
                      }
                  }
              }
          '''
              t = t.replace("android {", "android {" + block, 1)
              t = t.replace(
                  "release {",
                  'release {\n            if (rootProject.file("keystore.properties").exists()) {\n                signingConfig signingConfigs.release\n            }',
                  1,
              )
              p.write_text(t)
          print("gradle signing ready")
          PY

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Assemble release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Package artifact
        run: |
          set -e
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          ls -lh "$APK"
          VER=$(node -p "require('./package.json').version")
          cp "$APK" "SA-Invoice-Pro-Lab-v${VER}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SA-Invoice-Pro-Lab-APK
          path: SA-Invoice-Pro-Lab-v*.apk
          retention-days: 30
