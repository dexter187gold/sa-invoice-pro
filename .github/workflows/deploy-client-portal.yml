name: Deploy Customer Client Portal

on:
  push:
    branches: [main]
    paths:
      - 'client-portal/**'
      - '.github/workflows/deploy-client-portal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-client-portal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy standalone customer portal
        working-directory: client-portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify portal and API CORS
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            https://sa-invoice-pro-client-portal.pcrepairdex.workers.dev/ >/tmp/client-portal.html
          grep -q 'Client Portal' /tmp/client-portal.html
          curl --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            -X OPTIONS \
            -H 'Origin: https://sa-invoice-pro-client-portal.pcrepairdex.workers.dev' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: content-type,authorization' \
            -D /tmp/client-portal-cors.headers -o /dev/null \
            https://saip-sync.onrender.com/api/client-portal/login
          grep -qi 'Access-Control-Allow-Origin: https://sa-invoice-pro-client-portal.pcrepairdex.workers.dev' /tmp/client-portal-cors.headers
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            -H 'Origin: https://sa-invoice-pro-client-portal.pcrepairdex.workers.dev' \
            -D /tmp/client-portal-health.headers -o /tmp/client-portal-health.json \
            https://saip-sync.onrender.com/api/client-portal/health
          grep -qi 'Access-Control-Allow-Origin: https://sa-invoice-pro-client-portal.pcrepairdex.workers.dev' /tmp/client-portal-health.headers
          grep -q 'https://sa-invoice-pro-client-portal.pcrepairdex.workers.dev' /tmp/client-portal-health.json
          status=$(curl --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            -H 'Origin: https://sa-invoice-pro-client-portal.pcrepairdex.workers.dev' \
            -H 'Content-Type: application/json' \
            -D /tmp/client-portal-login.headers -o /tmp/client-portal-login.json -w '%{http_code}' \
            -d '{"username":"portal-smoke@example.invalid","pin":"000000"}' \
            https://saip-sync.onrender.com/api/client-portal/login)
          test "$status" = "401"
          grep -qi 'Access-Control-Allow-Origin: https://sa-invoice-pro-client-portal.pcrepairdex.workers.dev' /tmp/client-portal-login.headers
