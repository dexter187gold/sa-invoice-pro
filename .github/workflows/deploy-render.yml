# Trigger Render deploys via API when server files change.
# GitHub → Settings → Secrets and variables → Actions → New repository secret:
#   RENDER_API_KEY
#   RENDER_LICENSE_SERVICE_ID
#   RENDER_UPDATES_SERVICE_ID
name: Deploy Render

on:
  push:
    branches: [main, master]
    paths:
      - 'license_server.py'
      - 'update_server.py'
      - 'server_secrets.py'
      - 'version.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_LICENSE_SERVICE_ID: ${{ secrets.RENDER_LICENSE_SERVICE_ID }}
          RENDER_UPDATES_SERVICE_ID: ${{ secrets.RENDER_UPDATES_SERVICE_ID }}
        run: |
          if [ -z "$RENDER_API_KEY" ]; then
            echo "RENDER_API_KEY not set – skip deploy (add GitHub secret to enable)."
            exit 0
          fi
          deploy() {
            local id="$1"
            local name="$2"
            if [ -z "$id" ]; then
              echo "Skip $name – service id secret missing"
              return 0
            fi
            echo "Deploying $name ($id)..."
            code=$(curl -sS -o /tmp/render_out.json -w "%{http_code}" -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              "https://api.render.com/v1/services/${id}/deploys" \
              -d '{"clearCache":"do_not_clear"}')
            echo "HTTP $code"
            cat /tmp/render_out.json || true
            echo ""
            if [ "$code" != "201" ] && [ "$code" != "200" ]; then
              echo "Deploy request failed for $name"
              exit 1
            fi
          }
          deploy "$RENDER_LICENSE_SERVICE_ID" "license"
          deploy "$RENDER_UPDATES_SERVICE_ID" "updates"
          echo "Done"
