name: e2e-smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - run: bun run build
      - name: Install Chromium for the project Playwright version
        run: bun run playwright install --with-deps chromium
      - name: Run E2E using the locally locked Playwright binary
        run: bun run test:e2e
        env:
          CI: true
