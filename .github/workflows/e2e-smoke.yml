name: e2e-smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: bun install
      - run: bun run test:unit
      - run: bun run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: true
