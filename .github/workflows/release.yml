name: Create versioned GitHub release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        type: choice
        options:
          - beta
          - stable
        default: beta

permissions:
  contents: write

concurrency:
  group: release-main-version
  cancel-in-progress: false

jobs:
  release:
    name: Tag package version and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read package version and release channel
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          CHANNEL="stable"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$INPUT_CHANNEL"
          fi
          if [ "$CHANNEL" = "beta" ]; then
            TAG="v${VERSION}-beta.${RUN_NUMBER}"
          else
            TAG="v${VERSION}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          FLAGS=()
          if [ "$CHANNEL" = "beta" ]; then
            FLAGS+=(--prerelease)
          fi
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "SA Invoice Pro v$VERSION ($CHANNEL)" \
            --generate-notes \
            "${FLAGS[@]}"
