name: Deploy Cloudflare Worker
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_DEPLOY_CREDENTIALS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci || npm install --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: CI guard
        run: node scripts/ci-guard.mjs

      - name: Build web assets
        run: npm run build

      - name: Validate Worker bundle (dry-run)
        run: npx wrangler@4 deploy --dry-run
        continue-on-error: true

      - name: Skip production deploy (missing secrets)
        if: ${{ env.HAS_CLOUDFLARE_DEPLOY_CREDENTIALS != 'true' }}
        run: |
          echo '::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — production Worker deploy skipped (not a failure).'
          echo 'Pages may still deploy via Cloudflare Pages Git integration.'

      - name: Deploy to Cloudflare Workers
        if: ${{ env.HAS_CLOUDFLARE_DEPLOY_CREDENTIALS == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
