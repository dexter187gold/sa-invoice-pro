<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SA Invoice Pro">
  <defs>
    <linearGradient id="saGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A86B"/>
      <stop offset="55%" stop-color="#007A4D"/>
      <stop offset="100%" stop-color="#005C3A"/>
    </linearGradient>
    <linearGradient id="saGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB81C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <!-- Transparent background (no fill) -->
  <!-- Badge disc -->
  <circle cx="128" cy="100" r="72" fill="url(#saGreen)"/>
  <circle cx="128" cy="100" r="72" fill="none" stroke="#FFB81C" stroke-width="4" opacity="0.9"/>
  <!-- Big SA -->
  <text x="128" y="118" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="72" font-weight="800" fill="#FFFFFF" letter-spacing="-2">SA</text>
  <!-- Wordmark -->
  <text x="128" y="198" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="28" font-weight="700" fill="#007A4D">Invoice Pro</text>
  <rect x="78" y="208" width="100" height="4" rx="2" fill="url(#saGold)"/>
  <text x="128" y="236" text-anchor="middle" font-family="Segoe UI, system-ui, -apple-system, sans-serif"
        font-size="16" font-weight="600" fill="#64748B">v3.3</text>
</svg>
