  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />

  <script src="libs/jspdf.plugin.autotable.min.js?v=1.1.0"></script>
  <script>
  /* Force fresh assets after version change – no Ctrl+F5 */
  (function () {
    var VER = '1.1.0';
    window.SA_BUILD = VER;
    try {
      var prev = localStorage.getItem('sa_build_ver');
      if (prev && prev !== VER) {
        localStorage.setItem('sa_build_ver', VER);
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) { return r.unregister(); }));
          }).then(function () {
            if (window.caches) {
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              });
            }
          }).then(function () {
            location.reload();
          }).catch(function () { location.reload(); });
          return;
        }
        location.reload();
        return;
      }
      localStorage.setItem('sa_build_ver', VER);
    } catch (e) {}

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'SA_SW_UPDATED') {
          var k = 'sa_sw_rl_' + (e.data.cache || '');
          if (!sessionStorage.getItem(k)) {
            sessionStorage.setItem(k, '1');
            location.reload();
          }
        }
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js?v=' + VER).then(function (reg) {
          setInterval(function () { try { reg.update(); } catch (x) {} }, 30000);
          if (reg.waiting) {
            try { reg.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (x) {}
          }
          reg.addEventListener('updatefound', function () {
            var nw = reg.installing;
            if (!nw) return;
            nw.addEventListener('statechange', function () {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                location.reload();
              }
            });
          });
        }).catch(function () {});
      });
    }
  })();
  </script>
</head>
<script>
  (function(){
    try {
      var m = localStorage.getItem('sa_view_mode');
      if (!m) {
        m = (window.matchMedia('(max-width:768px)').matches ||
             window.matchMedia('(hover:none) and (pointer:coarse)').matches)
             ? 'mobile' : 'desktop';
      }
      document.documentElement.setAttribute('data-view', m);
    } catch(e) {}
  })();
  </script>
<body class="antialiased">
  <div id="auth-screen" class="fixed inset-0 bg-sa-navy z-50 auth-screen-scroll">
    <div class="auth-screen-inner">
      <div class="auth-card w-full max-w-md bg-white rounded-2xl shadow-2xl">
        <div class="bg-sa-green p-6 text-center text-white auth-card-header">
          <img src="icons/logo-mark.svg" alt="SA Invoice Pro" width="72" height="72" style="margin:0 auto 12px;display:block" onerror="this.src='icons/logo.svg'"/>
          <h1 class="text-xl font-bold">SA Invoice Pro</h1>
          <p class="text-sm text-green-100 mt-1">1.1.0</p>
        </div>
        <div class="p-6 auth-card-body" id="auth-content">
          <p id="boot-status" class="text-center text-slate-500 text-sm">Starting…</p>
        </div>
      </div>
    </div>
  </div>
  <div id="app" class="min-h-screen flex flex-col hidden">
    <header class="bg-sa-navy text-white shadow-lg sticky top-0 z-40">
      <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <button id="btn-home" class="w-10 h-10 rounded-lg overflow-hidden hover:opacity-90" title="Home">

          </button>
          <div>
            <h1 class="font-bold text-lg leading-tight">SA Invoice Pro</h1>
            <p class="text-xs text-slate-400">1.1.0 · Tickets CRM</p>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-theme" class="p-2 hover:bg-slate-700 rounded-lg" title="Theme"><i data-lucide="moon" class="w-5 h-5"></i></button>
          <button id="btn-lock" class="p-2 hover:bg-slate-700 rounded-lg" title="Lock"><i data-lucide="lock" class="w-5 h-5"></i></button>
          <button id="btn-install" class="hidden px-3 py-1.5 bg-sa-green rounded-lg text-sm font-medium">Install</button>
          <button id="btn-menu" class="p-2 hover:bg-slate-700 rounded-lg"><i data-lucide="menu" class="w-6 h-6"></i></button>
        </div>
      </div>
    </header>
    <div class="flex flex-1 overflow-hidden min-h-0" style="min-height:0;flex:1;">
      <aside id="sidebar" class="w-64 bg-white border-r flex-shrink-0 flex-col hidden lg:flex">
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="nav-desktop"></nav>
        <div class="p-4 border-t text-xs text-slate-500"><p id="user-display">User</p><p class="mt-1">Offline • Templates • Tickets CRM</p></div>
      </aside>
      <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-30 hidden lg:hidden"></div>
      <aside id="mobile-sidebar" class="fixed top-0 left-0 h-full w-72 bg-white z-40 -translate-x-full transition-transform lg:hidden flex flex-col">
        <div class="p-4 border-b flex items-center justify-between">
          <span class="font-bold text-lg">Menu</span>
          <button id="btn-close-menu" class="p-2"><i data-lucide="x" class="w-5 h-5"></i></button>
        </div>
        <nav class="flex-1 p-4 space-y-1 overflow-y-auto" id="nav-mobile"></nav>
      </aside>
      <main id="main" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8"></main>
    </div>
  </div>
  <div id="toast" class="fixed bottom-4 right-4 z-50 hidden"></div>
